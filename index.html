<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartPrompter 智慧口播提詞機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 4px;
        }
        /* Touch scrollbar optimization */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Mobile HUD Auto-fade effect */
        .hud-fade-out {
            opacity: 0.15;
            transform: translateY(12px);
            pointer-events: none;
        }
        .hud-fade-out:hover, .hud-fade-out:active, .hud-fade-out:focus-within {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

    <!-- Navigation / Top Control Bar (Hidden in prompt mode to save full mobile screen space) -->
    <header id="top-header" class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-4 py-2 flex items-center justify-between shrink-0 z-30 transition-all duration-300">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-md shadow-indigo-500/20 shrink-0">
                <i class="fa-solid font-bold text-white text-base sm:text-lg fa-display"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base tracking-wide flex items-center gap-1.5">
                    SmartPrompter <span class="text-[10px] sm:text-xs font-normal px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">口播神器</span>
                </h1>
            </div>
        </div>

        <!-- Mode Switcher -->
        <div class="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700/60">
            <button id="btn-mode-edit" onclick="switchMode('edit')" class="px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-pen-to-square text-[11px]"></i> 編輯文案
            </button>
            <button id="btn-mode-prompt" onclick="switchMode('prompt')" class="px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 flex items-center gap-1.5">
                <i class="fa-solid fa-play text-[11px]"></i> 提詞模式
            </button>
        </div>

        <div class="flex items-center space-x-1 sm:space-x-2">
            <button onclick="toggleKeyShortcutsModal()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="快捷鍵說明">
                <i class="fa-solid fa-keyboard text-sm sm:text-base"></i>
            </button>
            <button onclick="toggleFullscreen()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="全螢幕">
                <i class="fa-solid fa-expand text-sm sm:text-base" id="fullscreen-icon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <main class="flex-1 relative overflow-hidden flex">
        
        <!-- ================= EDIT MODE PANEL ================= -->
        <div id="view-edit" class="w-full h-full flex flex-col lg:flex-row p-3 sm:p-5 gap-4 sm:gap-6 overflow-y-auto">
            <!-- Left Panel: Textarea -->
            <div class="flex-1 flex flex-col bg-slate-900 rounded-2xl border border-slate-800/80 shadow-2xl overflow-hidden min-h-[320px] sm:min-h-[400px]">
                <div class="bg-slate-800/50 px-3.5 py-2.5 border-b border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-align-left text-indigo-400 text-xs sm:text-sm"></i>
                        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">講稿腳本</span>
                    </div>
                    <div class="flex items-center space-x-2.5 text-[11px] sm:text-xs text-slate-400">
                        <span id="stat-char-count">0 字</span>
                        <span>•</span>
                        <span id="stat-read-time">預估 0 分鐘</span>
                    </div>
                </div>
                
                <textarea id="script-input" class="flex-1 p-4 sm:p-5 bg-transparent text-slate-100 text-base sm:text-lg leading-relaxed focus:outline-none resize-none font-normal placeholder-slate-600" placeholder="請在此輸入或貼上您的口播腳本...&#10;&#10;提示：可以利用右側工具插入 [標題] 與 [動作提示]，拍攝時只提醒不讀出！"></textarea>
                
                <!-- Editor Bottom Toolbar -->
                <div class="bg-slate-900 border-t border-slate-800/80 p-2.5 sm:p-3 flex flex-wrap items-center justify-between gap-2 sm:gap-3">
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <button onclick="loadSampleScript()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-[11px] sm:text-xs text-slate-300 rounded-lg border border-slate-700/80 transition">
                            <i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> 載入範例
                        </button>
                        <button onclick="clearScript()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-rose-900/40 hover:text-rose-300 text-[11px] sm:text-xs text-slate-400 rounded-lg border border-slate-700/80 transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> 清空
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="file" id="file-import" class="hidden" accept=".txt" onchange="importTxtFile(event)">
                        <button onclick="document.getElementById('file-import').click()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-[11px] sm:text-xs text-slate-300 rounded-lg border border-slate-700/80 transition hidden sm:inline-flex items-center">
                            <i class="fa-solid fa-file-import mr-1"></i> 匯入 TXT
                        </button>
                        <button onclick="startPrompterWithCountdown()" class="px-4 sm:px-5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                            <i class="fa-solid fa-circle-play text-sm"></i> 開始提詞
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Quick Settings & Speaker Cues -->
            <div class="w-full lg:w-80 flex flex-col gap-4">
                <!-- Speaker Cue Helper Card -->
                <div class="bg-slate-900 rounded-2xl border border-slate-800/80 p-3.5 sm:p-4 space-y-2.5">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-amber-400"></i> 演講者不讀出提示語法
                    </h3>
                    <p class="text-[11px] sm:text-xs text-slate-400 leading-relaxed">
                        在講稿中加入提示，提詞時會自動轉為醒目標籤（拍攝時只提醒不讀出）：
                    </p>
                    <div class="grid grid-cols-2 lg:grid-cols-1 gap-2 pt-1">
                        <button onclick="insertTag('[標題: 開場白]')" class="px-3 py-2 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-xl text-left text-xs text-amber-300 font-medium transition flex items-center justify-between">
                            <span><i class="fa-solid fa-bookmark mr-1.5"></i> 段落標題</span>
                            <span class="text-[10px] opacity-70"># 標題</span>
                        </button>
                        <button onclick="insertTag('[提示: 微笑/展現產品]')" class="px-3 py-2 bg-sky-500/10 hover:bg-sky-500/20 border border-sky-500/30 rounded-xl text-left text-xs text-sky-300 font-medium transition flex items-center justify-between">
                            <span><i class="fa-solid fa-clapperboard mr-1.5"></i> 動作提示</span>
                            <span class="text-[10px] opacity-70">[提示: xxx]</span>
                        </button>
                    </div>
                </div>

                <!-- Saved Scripts Panel -->
                <div class="bg-slate-900 rounded-2xl border border-slate-800/80 p-3.5 sm:p-4 space-y-2.5 flex-1 flex flex-col min-h-[180px]">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-box-archive text-indigo-400"></i> 草稿存檔
                        </h3>
                        <button onclick="saveCurrentScript()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">
                            + 快速儲存
                        </button>
                    </div>
                    <div id="saved-scripts-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs text-slate-400 max-h-[160px] lg:max-h-none">
                        <!-- Saved scripts inserted by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= PROMPTER DISPLAY MODE ================= -->
        <div id="view-prompt" class="hidden absolute inset-0 bg-slate-950 flex flex-col justify-center items-center overflow-hidden touch-pan-y">
            
            <!-- Focus Guide Line Highlight Overlay (Optimized for Mobile) -->
            <div id="reading-guide" class="absolute w-full border-y border-indigo-500/50 bg-indigo-500/10 pointer-events-none z-10 transition-all duration-300 h-16 sm:h-20" style="top: 32%;">
                <div class="absolute left-2.5 sm:left-4 top-1/2 -translate-y-1/2 flex items-center gap-1 text-indigo-400/80 text-[10px] sm:text-xs font-mono font-bold select-none">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i> 視線焦線
                </div>
            </div>

            <!-- Prompter Scroll Container (Optimized for Mobile Gestures) -->
            <div id="prompter-box" class="w-full h-full overflow-y-auto no-scrollbar z-10 px-4 sm:px-8 py-[40vh] transition-all" onclick="handlePrompterScreenTap(event)" ontouchstart="handleTouchStart()" ontouchend="handleTouchEnd()">
                <div id="prompter-content-wrapper" class="max-w-3xl mx-auto transition-transform duration-200">
                    <div id="prompter-text" class="font-bold leading-relaxed text-center tracking-wide text-slate-100 space-y-3">
                        <!-- Prompter text rendered here -->
                    </div>
                </div>
            </div>

            <!-- Exit Button for Mobile (Top Right Quick Exit) -->
            <button onclick="switchMode('edit')" class="absolute top-3 right-3 z-30 w-9 h-9 rounded-full bg-slate-900/80 border border-slate-700/80 text-slate-300 hover:text-white flex items-center justify-center backdrop-blur shadow-md transition sm:hidden" title="返回編輯">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Floating HUD Control Bar (Ultra-Compact on Mobile) -->
            <div id="prompter-hud" class="absolute bottom-4 sm:bottom-6 inset-x-0 mx-auto max-w-2xl w-[94%] bg-slate-900/95 backdrop-blur-lg border border-slate-800 rounded-2xl shadow-2xl p-2.5 sm:p-3 z-20 flex flex-col gap-2 transition-all duration-300">
                
                <!-- Main Control Buttons & Sliders -->
                <div class="flex items-center justify-between gap-2 sm:gap-3">
                    <!-- Left: Play/Pause/Reset -->
                    <div class="flex items-center space-x-1.5 sm:space-x-2">
                        <button id="btn-play-pause" onclick="togglePlayPause()" class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-base sm:text-lg shadow-lg shadow-indigo-600/30 transition shrink-0">
                            <i id="icon-play-pause" class="fa-solid fa-play"></i>
                        </button>
                        <button onclick="resetPrompterScroll()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition shrink-0" title="回到頂部 (R)">
                            <i class="fa-solid fa-rotate-left text-xs sm:text-sm"></i>
                        </button>
                    </div>

                    <!-- Middle: Speed Control Slider -->
                    <div class="flex-1 flex items-center space-x-2 sm:space-x-3 bg-slate-800/80 px-2.5 sm:px-3 py-1.5 rounded-xl border border-slate-700/50 min-w-0">
                        <i class="fa-solid fa-gauge-high text-[11px] sm:text-xs text-indigo-400 shrink-0"></i>
                        <span class="text-[11px] sm:text-xs text-slate-400 shrink-0 hidden sm:inline">速度</span>
                        <input type="range" id="slider-speed" min="1" max="100" value="25" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer" oninput="updateSpeedFromSlider(this.value)">
                        <span id="speed-display" class="text-[11px] sm:text-xs font-mono font-bold text-indigo-300 w-6 text-right shrink-0">25</span>
                    </div>

                    <!-- Right: Toggle Settings Drawer & Guide -->
                    <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                        <button id="btn-toggle-guide" onclick="toggleGuideLine()" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-indigo-400 text-xs font-medium border border-slate-700 transition" title="切換焦線">
                            <i class="fa-solid fa-ruler-horizontal text-xs"></i>
                        </button>
                        <button onclick="toggleHudSettingsDrawer()" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition" title="調整樣式">
                            <i class="fa-solid fa-sliders text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Extended Settings Drawer (Font size, margin width, align) -->
                <div id="hud-extra-settings" class="hidden pt-2 border-t border-slate-800/80 grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                    <!-- Font Size Slider -->
                    <div class="flex items-center space-x-1.5 bg-slate-800/50 p-2 rounded-xl col-span-1">
                        <i class="fa-solid fa-text-height text-slate-400 text-xs"></i>
                        <span class="text-[11px] text-slate-400 shrink-0">字級</span>
                        <input type="range" id="slider-fontsize" min="20" max="80" value="32" class="w-full accent-indigo-500 h-1 bg-slate-700 rounded cursor-pointer" oninput="updateFontSize(this.value)">
                        <span id="fontsize-display" class="font-mono text-indigo-300 text-[11px] shrink-0">32</span>
                    </div>

                    <!-- Text Margin Width Slider -->
                    <div class="flex items-center space-x-1.5 bg-slate-800/50 p-2 rounded-xl col-span-1">
                        <i class="fa-solid fa-arrows-left-right text-slate-400 text-xs"></i>
                        <span class="text-[11px] text-slate-400 shrink-0">邊界</span>
                        <input type="range" id="slider-margin" min="50" max="100" value="92" class="w-full accent-indigo-500 h-1 bg-slate-700 rounded cursor-pointer" oninput="updateMarginWidth(this.value)">
                        <span id="margin-display" class="font-mono text-indigo-300 text-[11px] shrink-0">92%</span>
                    </div>

                    <!-- Alignment Control -->
                    <div class="flex items-center justify-between bg-slate-800/50 p-2 rounded-xl col-span-2 sm:col-span-1">
                        <span class="text-[11px] text-slate-400">排版</span>
                        <div class="flex items-center space-x-1">
                            <button onclick="setTextAlign('left')" class="px-2 py-0.5 rounded bg-slate-700 hover:bg-indigo-600 text-slate-200 text-xs">
                                <i class="fa-solid fa-align-left"></i>
                            </button>
                            <button onclick="setTextAlign('center')" class="px-2 py-0.5 rounded bg-slate-700 hover:bg-indigo-600 text-slate-200 text-xs">
                                <i class="fa-solid fa-align-center"></i>
                            </button>
                            <button onclick="setTextAlign('right')" class="px-2 py-0.5 rounded bg-slate-700 hover:bg-indigo-600 text-slate-200 text-xs">
                                <i class="fa-solid fa-align-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Countdown Overlay -->
            <div id="countdown-overlay" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-md z-40 flex flex-col items-center justify-center">
                <div id="countdown-number" class="text-8xl sm:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-tr from-indigo-500 to-purple-400 animate-bounce">
                    3
                </div>
                <p class="text-slate-400 text-xs sm:text-sm mt-4 tracking-widest uppercase">準備拍攝，即將開始...</p>
            </div>
        </div>
    </main>

    <!-- Keyboard Shortcuts Modal -->
    <div id="modal-shortcuts" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm sm:text-base flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-indigo-400"></i> 鍵盤快捷鍵
                </h3>
                <button onclick="toggleKeyShortcutsModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-2 text-xs text-slate-300">
                <div class="flex justify-between p-2 rounded bg-slate-800/60">
                    <span class="font-mono bg-slate-700 px-2 py-0.5 rounded text-indigo-300">Space 鍵</span>
                    <span>播放 / 暫停提詞</span>
                </div>
                <div class="flex justify-between p-2 rounded bg-slate-800/60">
                    <span class="font-mono bg-slate-700 px-2 py-0.5 rounded text-indigo-300">↑ / ↓ 方向鍵</span>
                    <span>加快 / 減慢滾動速度</span>
                </div>
                <div class="flex justify-between p-2 rounded bg-slate-800/60">
                    <span class="font-mono bg-slate-700 px-2 py-0.5 rounded text-indigo-300">← / → 方向鍵</span>
                    <span>縮小 / 放大字型</span>
                </div>
                <div class="flex justify-between p-2 rounded bg-slate-800/60">
                    <span class="font-mono bg-slate-700 px-2 py-0.5 rounded text-indigo-300">R 鍵</span>
                    <span>重設並回到最頂部</span>
                </div>
                <div class="flex justify-between p-2 rounded bg-slate-800/60">
                    <span class="font-mono bg-slate-700 px-2 py-0.5 rounded text-indigo-300">Esc 鍵</span>
                    <span>返回文案編輯模式</span>
                </div>
            </div>
            <button onclick="toggleKeyShortcutsModal()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-xs transition">
                我知道了
            </button>
        </div>
    </div>

    <script>
        // State Management
        let appState = {
            mode: 'edit', // 'edit' or 'prompt'
            isPlaying: false,
            speed: 25, // Scroll speed standard factor
            fontSize: window.innerWidth < 640 ? 32 : 48, // Responsive default font size
            marginWidth: window.innerWidth < 640 ? 92 : 80,
            textAlign: 'center',
            showGuide: true,
            scrollAccumulator: 0,
            isTouchDragging: false
        };

        let animFrameId = null;
        let hudTimer = null;
        let lastTimestamp = 0;

        // DOM Element Cache
        const topHeader = document.getElementById('top-header');
        const scriptInput = document.getElementById('script-input');
        const prompterBox = document.getElementById('prompter-box');
        const prompterText = document.getElementById('prompter-text');
        const prompterWrapper = document.getElementById('prompter-content-wrapper');
        const viewEdit = document.getElementById('view-edit');
        const viewPrompt = document.getElementById('view-prompt');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlayPause = document.getElementById('icon-play-pause');
        const sliderSpeed = document.getElementById('slider-speed');
        const speedDisplay = document.getElementById('speed-display');
        const prompterHud = document.getElementById('prompter-hud');
        const readingGuide = document.getElementById('reading-guide');

        window.addEventListener('DOMContentLoaded', () => {
            // Synchronize sliders with dynamic defaults
            document.getElementById('slider-fontsize').value = appState.fontSize;
            document.getElementById('fontsize-display').innerText = appState.fontSize;
            document.getElementById('slider-margin').value = appState.marginWidth;
            document.getElementById('margin-display').innerText = `${appState.marginWidth}%`;

            // Load saved script
            const savedText = localStorage.getItem('smartprompter_script');
            if (savedText) {
                scriptInput.value = savedText;
            } else {
                loadSampleScript();
            }
            updateStats();
            renderSavedScriptsList();

            // Setup listeners
            scriptInput.addEventListener('input', () => {
                updateStats();
                localStorage.setItem('smartprompter_script', scriptInput.value);
            });

            document.addEventListener('keydown', handleGlobalKeydown);
        });

        function updateStats() {
            const text = scriptInput.value.trim();
            const charCount = text.length;
            const minutes = Math.ceil(charCount / 300) || 0;
            
            document.getElementById('stat-char-count').innerText = `${charCount} 字`;
            document.getElementById('stat-read-time').innerText = `預估 ${minutes} 分鐘`;
        }

        function loadSampleScript() {
            const sample = `# 開場白
大家好！歡迎來到今天的口播影片。

[提示: 展現自信笑容，指向鏡頭]
今天我要跟大家分享 3 個讓口播影片觀看率提升 200% 的關鍵技巧！

# 第一點：黃金開場
[提示: 語速加快，強調重點]
開頭千萬不要拖泥帶水，直接提出觀眾最關心的痛點或核心結論，鎖定注意力！

# 第二點：眼神與鏡頭聚焦
[提示: 眼神看著視線焦線，保持自然]
使用提詞機時，將文案寬度適度縮窄，讓視線落在鏡頭前方，眼神就不會忽左忽右。

# 第三點：語速與節奏控制
[提示: 停頓 2 秒，手勢輔助]

        function insertTag(tagText) {
            const start = scriptInput.selectionStart;
            const end = scriptInput.selectionEnd;
            const val = scriptInput.value;
            scriptInput.value = val.substring(0, start) + "\n" + tagText + "\n" + val.substring(end);
            scriptInput.focus();
            scriptInput.selectionStart = scriptInput.selectionEnd = start + tagText.length + 2;
            updateStats();
            localStorage.setItem('smartprompter_script', scriptInput.value);
        }

        function clearScript() {
            if (confirm('確定要清空當前腳本嗎？')) {
                scriptInput.value = '';
                updateStats();
                localStorage.setItem('smartprompter_script', '');
            }
        }

        function importTxtFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                scriptInput.value = e.target.result;
                updateStats();
                localStorage.setItem('smartprompter_script', scriptInput.value);
            };
            reader.readAsText(file);
        }

        function saveCurrentScript() {
            const text = scriptInput.value.trim();
            if (!text) return;
            let drafts = JSON.parse(localStorage.getItem('smartprompter_drafts') || '[]');
            const title = text.substring(0, 15).replace(/\n/g, ' ') + '...';
            drafts.unshift({ id: Date.now(), title: title, content: text, date: new Date().toLocaleDateString() });
            if (drafts.length > 5) drafts = drafts.slice(0, 5);
            localStorage.setItem('smartprompter_drafts', JSON.stringify(drafts));
            renderSavedScriptsList();
        }

        function renderSavedScriptsList() {
            const container = document.getElementById('saved-scripts-list');
            const drafts = JSON.parse(localStorage.getItem('smartprompter_drafts') || '[]');
            if (drafts.length === 0) {
                container.innerHTML = `<div class="text-slate-600 text-center py-4">尚無存檔草稿</div>`;
                return;
            }
            container.innerHTML = drafts.map(d => `
                <div class="p-2 bg-slate-800/80 hover:bg-slate-800 rounded-lg flex items-center justify-between group cursor-pointer transition" onclick="loadDraft(${d.id})">
                    <div class="truncate flex-1 pr-2">
                        <div class="font-medium text-slate-200 truncate">${escapeHtml(d.title)}</div>
                        <div class="text-[10px] text-slate-500">${d.date}</div>
                    </div>
                    <button onclick="event.stopPropagation(); deleteDraft(${d.id})" class="text-slate-500 hover:text-rose-400 opacity-80 sm:opacity-0 group-hover:opacity-100 p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        function loadDraft(id) {
            const drafts = JSON.parse(localStorage.getItem('smartprompter_drafts') || '[]');
            const draft = drafts.find(d => d.id === id);
            if (draft) {
                scriptInput.value = draft.content;
                updateStats();
                localStorage.setItem('smartprompter_script', draft.content);
            }
        }

        function deleteDraft(id) {
            let drafts = JSON.parse(localStorage.getItem('smartprompter_drafts') || '[]');
            drafts = drafts.filter(d => d.id !== id);
            localStorage.setItem('smartprompter_drafts', JSON.stringify(drafts));
            renderSavedScriptsList();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderPrompterText(rawText) {
            if (!rawText || !rawText.trim()) {
                return `<div class="text-slate-600 py-10">（尚未輸入任何文案，請返回編輯模式貼上講稿）</div>`;
            }

            const lines = rawText.split('\n');
            let outputHtml = '';

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) {
                    outputHtml += `<div class="h-3 sm:h-4"></div>`;
                    return;
                }

                // Section Title Check (# Title or [標題: xxx])
                if (trimmed.startsWith('#') || /^\[(標題|TITLE)[:：]/i.test(trimmed)) {
                    const titleText = trimmed.replace(/^#+\s*/, '').replace(/^\[(標題|TITLE)[:：]\s*/i, '').replace(/\]$/, '');
                    outputHtml += `
                        <div class="my-4 sm:my-6 flex justify-center">
                            <span class="inline-flex items-center gap-1.5 px-3 sm:px-4 py-1 sm:py-1.5 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs sm:text-sm font-semibold tracking-wider select-none">
                                <i class="fa-solid fa-bookmark text-[10px] sm:text-xs text-amber-400"></i>
                                <span>標題：${escapeHtml(titleText)}</span>
                                <span class="text-[10px] opacity-70 font-normal">（不唸出）</span>
                            </span>
                        </div>
                    `;
                }
                // Action Cue Check ([提示: xxx] or (提示: xxx))
                else if (/^[\(\[](提示|CUE|NOTE)[:：]/i.test(trimmed)) {
                    const cueText = trimmed.replace(/^[\(\[](提示|CUE|NOTE)[:：]\s*/i, '').replace(/[\)\]]$/, '');
                    outputHtml += `
                        <div class="my-2 sm:my-3 flex justify-center">
                            <span class="inline-flex items-center gap-1.5 px-3 py-0.5 sm:py-1 rounded-xl bg-sky-500/20 border border-sky-500/40 text-sky-300 text-[11px] sm:text-xs font-medium select-none">
                                <i class="fa-solid fa-clapperboard text-sky-400 text-[10px]"></i>
                                <span>動作提示：${escapeHtml(cueText)}</span>
                            </span>
                        </div>
                    `;
                }
                // Standard text line
                else {
                    let formatted = escapeHtml(line);
                    formatted = formatted.replace(/\[(提示|CUE)[:：](.*?)\]/g, (m, p1, p2) => `
                        <span class="inline-flex items-center gap-1 mx-1 px-1.5 py-0.5 rounded bg-sky-500/20 border border-sky-500/30 text-sky-300 text-[11px] font-normal align-middle select-none">
                            <i class="fa-solid fa-lightbulb text-[9px]"></i> ${p2}
                        </span>
                    `);
                    outputHtml += `<div class="py-1 sm:py-1.5">${formatted}</div>`;
                }
            });

            return outputHtml;
        }

        function switchMode(mode) {
            appState.mode = mode;
            const btnEdit = document.getElementById('btn-mode-edit');
            const btnPrompt = document.getElementById('btn-mode-prompt');

            if (mode === 'edit') {
                pausePrompter();
                topHeader.classList.remove('hidden');
                viewEdit.classList.remove('hidden');
                viewPrompt.classList.add('hidden');

                btnEdit.className = "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
                btnPrompt.className = "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 flex items-center gap-1.5";
            } else {
                prompterText.innerHTML = renderPrompterText(scriptInput.value);
                topHeader.classList.add('hidden'); // Hide top header on prompt mode to maximize view
                viewEdit.classList.add('hidden');
                viewPrompt.classList.remove('hidden');

                btnPrompt.className = "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
                btnEdit.className = "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 flex items-center gap-1.5";

                applyPrompterStyles();
                resetPrompterScroll();
                showHudTemporarily();
            }
        }

        function startPrompterWithCountdown() {
            switchMode('prompt');
            const overlay = document.getElementById('countdown-overlay');
            const numEl = document.getElementById('countdown-number');
            overlay.classList.remove('hidden');

            let count = 3;
            numEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    numEl.innerText = count;
                } else if (count === 0) {
                    numEl.innerText = "GO!";
                } else {
                    clearInterval(timer);
                    overlay.classList.add('hidden');
                    startPrompter();
                }
            }, 850);
        }

        function togglePlayPause() {
            if (appState.isPlaying) {
                pausePrompter();
            } else {
                startPrompter();
            }
        }

        function startPrompter() {
            if (appState.isPlaying) return;
            appState.isPlaying = true;
            iconPlayPause.className = "fa-solid fa-pause";
            btnPlayPause.classList.replace('bg-indigo-600', 'bg-amber-600');
            btnPlayPause.classList.replace('hover:bg-indigo-500', 'hover:bg-amber-500');

            lastTimestamp = performance.now();
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(scrollStep);

            startHudAutoFade();
        }

        function scrollStep(timestamp) {
            if (!appState.isPlaying) return;

            const elapsed = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (!appState.isTouchDragging && elapsed < 100) {
                // Calculate speed pixels per frame
                const speedFactor = (appState.speed / 30);
                const deltaPixels = speedFactor * (elapsed / 16.66);
                
                appState.scrollAccumulator += deltaPixels;

                if (appState.scrollAccumulator >= 1) {
                    const pixelsToMove = Math.floor(appState.scrollAccumulator);
                    prompterBox.scrollTop += pixelsToMove;
                    appState.scrollAccumulator -= pixelsToMove;
                }

                // Stop at bottom
                if (prompterBox.scrollTop + prompterBox.clientHeight >= prompterBox.scrollHeight - 5) {
                    pausePrompter();
                    return;
                }
            }

            animFrameId = requestAnimationFrame(scrollStep);
        }

        function pausePrompter() {
            appState.isPlaying = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            iconPlayPause.className = "fa-solid fa-play";
            btnPlayPause.classList.replace('bg-amber-600', 'bg-indigo-600');
            btnPlayPause.classList.replace('hover:bg-amber-500', 'hover:bg-indigo-500');
            showHudTemporarily();
        }

        function resetPrompterScroll() {
            pausePrompter();
            prompterBox.scrollTop = 0;
            appState.scrollAccumulator = 0;
        }

        function handlePrompterScreenTap(e) {
            // If user clicked inside HUD, do nothing
            if (e.target.closest('#prompter-hud')) return;

            if (prompterHud.classList.contains('hud-fade-out')) {
                showHudTemporarily();
            } else {
                togglePlayPause();
            }
        }

        function handleTouchStart() {
            appState.isTouchDragging = true;
            showHudTemporarily();
        }

        function handleTouchEnd() {
            appState.isTouchDragging = false;
            if (appState.isPlaying) {
                startHudAutoFade();
            }
        }

        function startHudAutoFade() {
            clearTimeout(hudTimer);
            hudTimer = setTimeout(() => {
                if (appState.isPlaying) {
                    prompterHud.classList.add('hud-fade-out');
                }
            }, 2500);
        }

        function showHudTemporarily() {
            prompterHud.classList.remove('hud-fade-out');
            clearTimeout(hudTimer);
            if (appState.isPlaying) {
                startHudAutoFade();
            }
        }

        function updateSpeedFromSlider(val) {
            appState.speed = parseInt(val, 10);
            speedDisplay.innerText = val;
            showHudTemporarily();
        }

        function updateFontSize(val) {
            appState.fontSize = parseInt(val, 10);
            document.getElementById('fontsize-display').innerText = val;
            applyPrompterStyles();
            showHudTemporarily();
        }

        function updateMarginWidth(val) {
            appState.marginWidth = parseInt(val, 10);
            document.getElementById('margin-display').innerText = `${val}%`;
            applyPrompterStyles();
            showHudTemporarily();
        }

        function setTextAlign(align) {
            appState.textAlign = align;
            applyPrompterStyles();
            showHudTemporarily();
        }

        function toggleGuideLine() {
            appState.showGuide = !appState.showGuide;
            const btn = document.getElementById('btn-toggle-guide');
            if (appState.showGuide) {
                readingGuide.classList.remove('hidden');
                btn.classList.replace('text-slate-500', 'text-indigo-400');
            } else {
                readingGuide.classList.add('hidden');
                btn.classList.replace('text-indigo-400', 'text-slate-500');
            }
        }

        function applyPrompterStyles() {
            prompterText.style.fontSize = `${appState.fontSize}px`;
            prompterText.style.textAlign = appState.textAlign;
            prompterWrapper.style.maxWidth = `${appState.marginWidth}%`;
        }

        function toggleHudSettingsDrawer() {
            const drawer = document.getElementById('hud-extra-settings');
            drawer.classList.toggle('hidden');
            showHudTemporarily();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
                document.getElementById('fullscreen-icon').className = "fa-solid fa-compress text-sm sm:text-base";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreen-icon').className = "fa-solid fa-expand text-sm sm:text-base";
                }
            }
        }

        function toggleKeyShortcutsModal() {
            const modal = document.getElementById('modal-shortcuts');
            modal.classList.toggle('hidden');
        }

        function handleGlobalKeydown(e) {
            if (document.activeElement === scriptInput && appState.mode === 'edit') return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (appState.mode === 'prompt') togglePlayPause();
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                const newSpeed = Math.min(100, appState.speed + 5);
                sliderSpeed.value = newSpeed;
                updateSpeedFromSlider(newSpeed);
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                const newSpeed = Math.max(1, appState.speed - 5);
                sliderSpeed.value = newSpeed;
                updateSpeedFromSlider(newSpeed);
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                const newSize = Math.min(80, appState.fontSize + 2);
                document.getElementById('slider-fontsize').value = newSize;
                updateFontSize(newSize);
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                const newSize = Math.max(20, appState.fontSize - 2);
                document.getElementById('slider-fontsize').value = newSize;
                updateFontSize(newSize);
            } else if (e.key === 'r' || e.key === 'R') {
                if (appState.mode === 'prompt') resetPrompterScroll();
            } else if (e.code === 'Escape') {
                if (appState.mode === 'prompt') switchMode('edit');
            }
        }
    </script>
